# البوابة — تُستدعى من كل مشروع. لا تعرف شيئًا عن مشروعٍ بعينه.
#
# تفرض قاعدتين من قواعد سياسة الإصدار بنفسها، لا بالنيّة:
#   القاعدة 1 — لا تلمس بيانات الإنتاج ولا أسراره: تُمحى ملفات .env المتتبَّعة
#     **قبل أول أمرٍ يملكه المشروع** (npm ci يشغّل سكربتات دورة حياة)، ولا يصل
#     إلى المشروع إلا سرٌّ واحد صريح هو TEST_ENV. لا `secrets: inherit`.
#   القاعدة 5 — لا فحصَ متخطّى: كل فحصٍ مُفعَّل يكتب علامته، وخطوةٌ ختامية تفشل
#     إن نقصت علامةُ فحصٍ طُلب. ويشمل ذلك تخطّي Playwright من داخله.
name: Gate

on:
  workflow_call:
    inputs:
      ref:
        description: "الـSHA المراد فحصه. فارغٌ = مرجع المستدعي."
        type: string
        required: false
        default: ""
      node_version:
        type: string
        default: "20"
      package_manager:
        description: "npm | pnpm — مدير الحزم الذي يثبّت ويشغّل الأوامر. pnpm يقرأ نسخته من حقل packageManager في package.json."
        type: string
        default: "npm"
      run_build:
        type: boolean
        default: true
      run_types:
        type: boolean
        default: false
      run_unit:
        type: boolean
        default: false
      run_e2e:
        type: boolean
        default: false
      build_command:
        description: "فارغٌ = `<pm> run build` بمدير الحزم المختار."
        type: string
        default: ""
      types_command:
        description: "فارغٌ = `<pm> run typecheck`."
        type: string
        default: ""
      unit_command:
        description: "فارغٌ = `<pm> test`."
        type: string
        default: ""
      e2e_command:
        description: "فارغٌ = `npx|pnpm exec playwright test --reporter=list,json`."
        type: string
        default: ""
      prepare_command:
        description: "أمرٌ يسبق الفحوص (توليد عميل ORM مثلًا). فارغٌ = لا شيء."
        type: string
        default: ""
      preset:
        description: "simple | standard | full — يقرّر الرحلة المرسومة في الملخّص"
        type: string
        default: "standard"
      max_skipped_tests:
        description: "سقف التخطّي في E2E. الصفر هو العقد؛ ارفعه فقط بمبرَّرٍ مكتوب."
        type: number
        default: 0
    secrets:
      TEST_ENV:
        description: "محتوى dotenv لبيئة الفحص. لا يُمرَّر إلا هو — ولا سرَّ إنتاجٍ أبدًا."
        required: false

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      STAGES: "البناء,الأنواع,الوحدة,E2E"
      PIPELINE_PRESET: ${{ inputs.preset }}
      PIPELINE_ENV: staging
      PIPELINE_SHA: ${{ inputs.ref || github.sha }}
      PIPELINE_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # القاعدة 1 — قبل npm ci، لأن التثبيت يشغّل سكربتات المشروع.
      - name: Purge tracked env files (rule 1)
        run: |
          set -euo pipefail
          removed=0
          for f in .env .env.local .env.production .env.production.local; do
            if [ -f "$f" ]; then rm -f "$f"; echo "removed $f"; removed=1; fi
          done
          [ "$removed" = "0" ] && echo "no tracked env file present" || true

      # الأسرار تُمرَّر بيئةً لا داخل تعبير — تعبيرُ `if` لا يقرأ الأسرار بثبات.
      - name: Write the test environment (the only secret that reaches the project)
        env:
          TEST_ENV: ${{ secrets.TEST_ENV }}
        run: |
          set -euo pipefail
          if [ -n "$TEST_ENV" ]; then
            printf '%s\n' "$TEST_ENV" > .env
            # ولا يكفي الملف: Playwright (وأي عملية اختبارٍ أخرى) تقرأ
            # process.env لا `.env` — فالحزمة تتخطّى نفسها بلا اعتماديات وتمرّ
            # خضراء. تُصدَّر المفاتيح إلى بيئة الخطوات التالية، وتُقنَّع قيمُها.
            n=0
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ""|\#*) continue ;; esac
              key=${line%%=*}; val=${line#*=}
              case "$key" in ""|*[!A-Za-z0-9_]*) continue ;; esac
              [ ${#val} -ge 8 ] && echo "::add-mask::$val"
              printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
              n=$((n+1))
            done < .env
            echo "wrote .env and exported $n vars from TEST_ENV"
          else
            echo "no TEST_ENV supplied"
          fi

      # القاعدة 5، الشقّ الأول — فحصٌ طُلب وأسرارُه غائبة يفشل، لا يُتخطّى صامتًا.
      - name: Preflight — a requested check may not silently lack its inputs
        env:
          TEST_ENV: ${{ secrets.TEST_ENV }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.run_e2e }}" = "true" ] && [ -z "$TEST_ENV" ]; then
            echo "::error::run_e2e=true بلا سرّ TEST_ENV — البوابة تفشل بدل أن تمرّ خضراء وهي لا تختبر شيئًا"
            exit 1
          fi
          mkdir -p .gate-ok

      # سكربتات القالب تُجلَب من مستودعها **بنفس الـSHA الذي تعمل به هذه الوظيفة**
      # (`job_workflow_sha`) — فلا ينفصل السكربت عن نسخة البوابة التي استدعت.
      - name: Fetch the template's own scripts
        uses: actions/checkout@v4
        with:
          repository: mooohamd/ci-templates
          ref: ${{ github.job_workflow_sha }}
          path: .ci-templates

      # مدير الحزم من المُدخَل: npm افتراضًا، وpnpm يُثبَّت قبل setup-node كي يعمل خزنُه.
      # الأوامر الافتراضية تُحلّ هنا لا في المُدخَلات — فيبقى npm كما كان لمن لم يغيّر شيئًا.
      - name: Resolve the package manager and default commands
        env:
          # المُدخَلات تمرّ بيئةً لا داخل النص — نصٌّ فيه علامات اقتباس أو $ لا يكسر الصدفة
          IN_PM: ${{ inputs.package_manager }}
          IN_BUILD: ${{ inputs.build_command }}
          IN_TYPES: ${{ inputs.types_command }}
          IN_UNIT: ${{ inputs.unit_command }}
          IN_E2E: ${{ inputs.e2e_command }}
        run: |
          set -euo pipefail
          pm="$IN_PM"
          case "$pm" in npm|pnpm) ;; *) echo "::error::package_manager غير معروف: $pm (npm | pnpm)"; exit 1;; esac
          exec_cmd="npx"; [ "$pm" = "pnpm" ] && exec_cmd="pnpm exec"
          build="$IN_BUILD"; [ -n "$build" ] || build="$pm run build"
          types="$IN_TYPES"; [ -n "$types" ] || types="$pm run typecheck"
          unit="$IN_UNIT";   [ -n "$unit" ]  || unit="$pm test"
          e2e="$IN_E2E";     [ -n "$e2e" ]   || e2e="$exec_cmd playwright test --reporter=list,json"
          # صيغة الأسطر المتعددة في GITHUB_ENV بمحدِّدٍ عشوائي لكل قيمة — أمرٌ فيه سطرٌ جديد
          # أو سطرٌ يساوي محدِّدًا ثابتًا لا يفسد الملف
          setvar() { local d; d="GATE_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"; { echo "$1<<$d"; echo "$2"; echo "$d"; } >> "$GITHUB_ENV"; }
          setvar PM "$pm"
          setvar BUILD_CMD "$build"
          setvar TYPES_CMD "$types"
          setvar UNIT_CMD "$unit"
          setvar E2E_CMD "$e2e"
          echo "$pm · build: $build · types: $types · unit: $unit · e2e: $e2e"

      # فعلٌ من طرفٍ ثالث يُثبَّت بـSHA كامل لا بوسمٍ متحرّك
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: ${{ inputs.package_manager == 'pnpm' }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install
        run: |
          set -euo pipefail
          if [ "$PM" = "pnpm" ]; then pnpm install --frozen-lockfile; else npm ci; fi

      - name: Prepare
        if: ${{ inputs.prepare_command != '' }}
        run: ${{ inputs.prepare_command }}

      - name: Stage — build
        if: ${{ inputs.run_build }}
        run: |
          echo "STAGE=البناء" >> "$GITHUB_ENV"
          node .ci-templates/scripts/stage.mjs "$STAGES" "البناء" running

      - name: Build
        if: ${{ inputs.run_build }}
        run: |
          set -o pipefail
          : "${BUILD_CMD:?أمر البناء غائب}"
          eval "$BUILD_CMD" && touch .gate-ok/build

      - name: Stage — types
        if: ${{ inputs.run_types }}
        run: |
          echo "STAGE=الأنواع" >> "$GITHUB_ENV"
          node .ci-templates/scripts/stage.mjs "$STAGES" "الأنواع" running

      - name: Types
        if: ${{ inputs.run_types }}
        run: |
          set -o pipefail
          : "${TYPES_CMD:?أمر الأنواع غائب}"
          eval "$TYPES_CMD" && touch .gate-ok/types

      - name: Stage — unit
        if: ${{ inputs.run_unit }}
        run: |
          echo "STAGE=الوحدة" >> "$GITHUB_ENV"
          node .ci-templates/scripts/stage.mjs "$STAGES" "الوحدة" running

      - name: Unit
        if: ${{ inputs.run_unit }}
        run: |
          set -o pipefail
          : "${UNIT_CMD:?أمر الوحدة غائب}"
          eval "$UNIT_CMD" && touch .gate-ok/unit

      # المتصفّح لا يأتي مع npm ci — وغيابُه يُسقط الحزمة كلها عند أول إقلاع.
      # يُخزَّن بمفتاح نسخة Playwright نفسها: ترقيةُ الحزمة تُبطل الخزن تلقائيًّا.
      - name: Resolve Playwright version
        if: ${{ inputs.run_e2e }}
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: ${{ inputs.run_e2e }}
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright (browser + system deps)
        if: ${{ inputs.run_e2e && steps.pw-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (browser cached)
        if: ${{ inputs.run_e2e && steps.pw-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium

      - name: Stage — e2e
        if: ${{ inputs.run_e2e }}
        run: |
          echo "STAGE=E2E" >> "$GITHUB_ENV"
          node .ci-templates/scripts/stage.mjs "$STAGES" "E2E" running

      - name: E2E
        if: ${{ inputs.run_e2e }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: pw-report.json
        run: |
          set -o pipefail
          : "${E2E_CMD:?أمر E2E غائب}"
          eval "$E2E_CMD"

      # القاعدة 5، الشقّ الثاني — Playwright يعدّ التخطّي نتيجةً متوقَّعة، فيُفحص التقرير.
      - name: E2E must have run something, and skipped nothing
        if: ${{ inputs.run_e2e }}
        run: |
          node .ci-templates/scripts/assert-no-skips.mjs pw-report.json ${{ inputs.max_skipped_tests }}
          touch .gate-ok/e2e

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && inputs.run_e2e }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            pw-report.json
          retention-days: 7

      # القاعدة 5، الشقّ الثالث — «طُلب فحصٌ ولم يُسجَّل نجاحه» يفشل مغلقًا.
      - name: Every requested check recorded a success
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$1" = "true" ] && [ ! -f ".gate-ok/$2" ]; then
              echo "::error::الفحص '$2' طُلب ولم تُسجَّل له علامة نجاح"; fail=1
            fi
          }
          check "${{ inputs.run_build }}" build
          check "${{ inputs.run_types }}" types
          check "${{ inputs.run_unit }}"  unit
          check "${{ inputs.run_e2e }}"   e2e
          [ "$fail" = "0" ] || exit 1
          echo "الفحوص المطلوبة كلها انتهت بنجاح: $(ls .gate-ok | tr '\n' ' ')"

      # شريط التقدّم يُختم — يُرى أعلى صفحة التشغيلة وفي تطبيق GitHub للجوال.
      # الفحص المُطفأ يُعلَن متخطّى لا ناجحًا: الشريط لا يجوز أن يقول أخضرَ عن
      # فحصٍ لم يُطلب — وهي القاعدة الخامسة نفسها مطبَّقةً على الرسم.
      - name: Compose the skipped list
        if: ${{ always() }}
        run: |
          set -euo pipefail
          skip=""
          [ "${{ inputs.run_build }}" = "true" ] || skip="$skip,البناء"
          [ "${{ inputs.run_types }}" = "true" ] || skip="$skip,الأنواع"
          [ "${{ inputs.run_unit }}"  = "true" ] || skip="$skip,الوحدة"
          [ "${{ inputs.run_e2e }}"   = "true" ] || skip="$skip,E2E"
          echo "SKIPPED=${skip#,}" >> "$GITHUB_ENV"

      - name: Progress — done
        if: ${{ success() }}
        run: node .ci-templates/scripts/stage.mjs "$STAGES" "E2E" done "$SKIPPED"

      - name: Progress — failed
        if: ${{ failure() }}
        run: node .ci-templates/scripts/stage.mjs "$STAGES" "${STAGE:-البناء}" failed "$SKIPPED" || true
